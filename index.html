<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เป่ายิ้งฉุบ 2 คน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff176;--bg2:#ff9ad5;--ink:#2a0a5e;--mute:#5b3a99;--a:#1f6bff;--b:#ff2e93;--stage:#ffffff;--go:#7a2cff;--gofg:#ffffff;--win:#00d26a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0a5e;--bg2:#0b1b5e;--ink:#ffffff;--mute:#c9b8ff;--stage:#f4f1ff;--go:#ffe94d;--gofg:#2a0a5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a0a5e;--bg2:#0b1b5e;--ink:#ffffff;--mute:#c9b8ff;--stage:#f4f1ff;--go:#ffe94d;--gofg:#2a0a5e;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Prompt",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 14px 32px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.6rem;font-weight:800;margin:0;text-align:center}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p{border-radius:28px;padding:12px 10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .2s,box-shadow .2s,opacity .2s}
.p.a{background:var(--a)}.p.b{background:var(--b)}
.p.turn{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--ink),0 8px 0 rgba(0,0,0,.18)}
.p.won{transform:scale(1.05);box-shadow:0 0 0 6px var(--win),0 8px 0 rgba(0,0,0,.18)}
.p.lost{opacity:.5}
.badge{display:flex;height:54px}.badge svg{height:100%;width:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.chip{display:inline-block;width:1.45em;height:1.45em;line-height:1.45em;border-radius:50%;color:#fff;font-weight:800;margin:0 .1em}.chip.a{background:var(--a)}.chip.b{background:var(--b)}
.stage{width:100%;background:var(--stage);border-radius:22px;padding:calc(2rem + 4px) 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hand{font-size:clamp(5rem,30vw,9rem);line-height:1.1;min-height:1.15em;user-select:none}
.hand.spin{filter:blur(1.5px);opacity:.85}
.name{font-weight:800;font-size:1.25rem;min-height:1.6em;color:var(--ink);color:#2a0a5e}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%}
.pick button{font:600 .65rem "Prompt",sans-serif;color:#2a0a5e;line-height:1.15;border:0;border-radius:10px;padding:4px 0;background:rgba(255,255,255,.9);cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center}
.pick button span{font-size:1.1rem}
.pick button:disabled{opacity:.3;cursor:default}
.status{min-height:4.4em;text-align:center;font-size:1.8rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.status small{font-weight:600;color:var(--mute);font-size:.9rem}
button.go{font:800 1.5rem "Prompt",sans-serif;border:0;border-radius:22px;padding:18px;background:var(--go);color:var(--gofg);cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 rgba(0,0,0,.25)}
button.go:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
button.go[hidden]{display:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at center,rgba(90,30,180,.85),rgba(5,0,25,.94));animation:fade .25s}
.ov[hidden],.cd[hidden],.card[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.cd{position:relative;display:flex;align-items:center;justify-content:center;width:min(80vw,340px);height:min(80vw,340px)}
.rings{position:absolute;inset:0}
.rings i{position:absolute;inset:0;border:6px solid #ffe94d;border-radius:50%;opacity:0;animation:ring .9s ease-out infinite}
.rings i:nth-child(2){animation-delay:.3s;border-color:#ff2e93}.rings i:nth-child(3){animation-delay:.6s;border-color:#4d8bff}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.3);opacity:0}}
.word{position:relative;font-weight:800;font-size:clamp(4rem,22vw,7.5rem);color:#fff;text-shadow:0 0 30px #ffe94d,0 6px 0 rgba(0,0,0,.35);white-space:nowrap}
.word.hot{color:#ffe94d;font-size:clamp(4.5rem,26vw,8.5rem);text-shadow:0 0 40px #ff2e93,0 6px 0 rgba(0,0,0,.35)}
.word.in{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.card{position:relative;width:min(100%,420px);background:var(--stage);color:#2a0a5e;border-radius:32px;padding:20px 16px 14px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 0 0 6px var(--cc),0 0 70px var(--cc),0 14px 0 rgba(0,0,0,.25);animation:cardin .6s cubic-bezier(.2,1.4,.4,1)}
.card.a{--cc:#1f6bff}.card.b{--cc:#ff2e93}.card.d{--cc:#ffd400}
@keyframes cardin{0%{transform:scale(.3) translateY(80px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.crown{font-size:3.2rem;line-height:1;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.side{border-radius:22px;padding:10px 6px 8px;color:#fff;font-weight:800;transition:transform .3s}
.side.a{background:#1f6bff}.side.b{background:#ff2e93}
.side.win{transform:scale(1.08);box-shadow:0 0 0 4px #00d26a}
.side.lose{opacity:.5}
.side .big{font-size:clamp(3.5rem,18vw,5.5rem);line-height:1.15;background:#fff;border-radius:16px}
.side .nm{font-size:1rem;margin-top:4px}
.title{font-size:clamp(1.9rem,8.5vw,2.7rem);font-weight:800;line-height:1.2;animation:titlein .6s .25s both cubic-bezier(.2,1.6,.4,1)}
@keyframes titlein{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.sub{color:#5b3a99;font-weight:600}
.card button.go{width:100%;margin-top:4px}
.close{background:none;border:0;color:#5b3a99;font:600 .9rem "Prompt",sans-serif;cursor:pointer;text-decoration:underline;padding:6px}
@media (prefers-reduced-motion:reduce){.word.in,.card,.title,.rings i,.crown,.ov{animation:none}}
</style>
</head>
<body>
<main>
  <h1>เป่ายิ้งฉุบ ✊✋✌️</h1>
  <div class="arena">
    <section class="p a" id="pa" aria-label="ผู้เล่นชาย">
      <div class="badge" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="38" r="16"/><path d="M37 27L56 8M38 8h18v18"/></svg></div>
      <div class="stage"><div class="hand" id="ha">❔</div><div class="name" id="la">&nbsp;</div></div>
      <div class="pick" id="ka"></div>
    </section>
    <section class="p b" id="pb" aria-label="ผู้เล่นหญิง">
      <div class="badge" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="24" r="16"/><path d="M32 40v20M21 50h22"/></svg></div>
      <div class="stage"><div class="hand" id="hb">❔</div><div class="name" id="lb">&nbsp;</div></div>
      <div class="pick" id="kb"></div>
    </section>
  </div>
  <div class="status" id="st" aria-live="polite"></div>
  <button class="go" id="go" hidden></button>
</main>
<div class="ov" id="ov" hidden role="dialog" aria-live="assertive">
  <div class="cd" id="cd"><div class="rings"><i></i><i></i><i></i></div><div class="word" id="word"></div></div>
  <div class="card" id="card" hidden>
    <div class="crown" id="crown"></div>
    <div class="vs">
      <div class="side a" id="sidea"><div class="big" id="ra"></div><div class="nm" id="rna"></div></div>
      <div class="side b" id="sideb"><div class="big" id="rb"></div><div class="nm" id="rnb"></div></div>
    </div>
    <div class="title" id="rt"></div>
    <div class="sub" id="rs"></div>
    <button class="go" id="rgo"></button>
    <button class="close" id="rclose">ปิดหน้าต่าง</button>
  </div>
  <canvas id="fx"></canvas>
</div>
<script>
const H=[{e:"✊",n:"ค้อน"},{e:"✋",n:"กระดาษ"},{e:"✌️",n:"กรรไกร"}];
const beats=(x,y)=>(x-y+3)%3===1; // 0 ค้อน>2 กรรไกร, 1 กระดาษ>0 ค้อน, 2 กรรไกร>1 กระดาษ
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function rnd(){const u=new Uint32Array(1);let v;do{crypto.getRandomValues(u);v=u[0]}while(v>=4294967295-(4294967295%3));return v%3}
const nameA='<span class="chip a">♂</span>', nameB='<span class="chip b">♀</span>';
let phase="pickA",ca=null,cb=null,timers={},goAction=null;

function openOv(){$("ov").hidden=false;$("cd").hidden=false;$("card").hidden=true}
function closeOv(){$("ov").hidden=true;stopFx()}
function setWord(w,hot,noPop){const el=$("word");el.textContent=w;el.className="word"+(hot?" hot":"");if(!noPop){void el.offsetWidth;el.classList.add("in")}}
let fxRaf=0;
function stopFx(){cancelAnimationFrame(fxRaf);const c=$("fx");c.getContext("2d").clearRect(0,0,c.width,c.height)}
function confetti(colors){
  stopFx();const c=$("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,w:6+Math.random()*8,h:10+Math.random()*10,vx:-1.5+Math.random()*3,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:colors[Math.floor(Math.random()*colors.length)]}));
  const end=performance.now()+4500;
  (function f(){x.clearRect(0,0,c.width,c.height);const now=performance.now();
    for(const p of ps){p.x+=p.vx+Math.sin(p.y/30);p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();if(p.y>c.height+20&&now<end-1500){p.y=-20;p.x=Math.random()*c.width}}
    if(now<end)fxRaf=requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
function showResult(){
  const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const card=$("card"),t=$("rt"),sa=$("sidea"),sb=$("sideb");
  $("cd").hidden=true;card.hidden=false;$("ov").hidden=false;
  $("ra").textContent=H[ca].e;$("rb").textContent=H[cb].e;
  $("rna").textContent=H[ca].n;$("rnb").textContent=H[cb].n;
  sa.className="side a";sb.className="side b";
  card.style.animation="none";t.style.animation="none";void card.offsetWidth;card.style.animation="";t.style.animation="";
  if(ca===cb){card.className="card d";$("crown").textContent="🤝";t.textContent="เสมอ!";$("rs").textContent="ออกเหมือนกัน ไม่มีใครชนะ";if(!rm)confetti(["#ffd400","#fff"])}
  else{const aw=beats(ca,cb);card.className="card "+(aw?"a":"b");sa.classList.add(aw?"win":"lose");sb.classList.add(aw?"lose":"win");
    $("crown").textContent="👑";t.innerHTML=(aw?nameA:nameB)+" เป็นผู้ชนะ";$("rs").textContent=aw?H[ca].n+" ชนะ "+H[cb].n:H[cb].n+" ชนะ "+H[ca].n;
    if(!rm)confetti(aw?["#1f6bff","#7fa2ff","#ffe94d","#fff"]:["#ff2e93","#ff9ad5","#ffe94d","#fff"])}
  $("rgo").textContent=$("go").textContent;
}
function buildPick(side){
  const box=$("k"+side);
  H.forEach((h,i)=>{const b=document.createElement("button");b.innerHTML="<span>"+h.e+"</span>"+h.n;b.onclick=()=>pick(side,i);box.appendChild(b)});
  const r=document.createElement("button");r.innerHTML="<span>🎲</span>สุ่ม";r.onclick=()=>pick(side,rnd());box.appendChild(r);
}
function setPickers(){
  const en={a:phase==="pickA",b:phase==="pickB"};
  ["a","b"].forEach(s=>{$("k"+s).querySelectorAll("button").forEach(b=>b.disabled=!en[s]);$("p"+s).classList.toggle("turn",en[s])});
}
function spin(s){stop(s);const el=$("h"+s);el.classList.add("spin");timers[s]=setInterval(()=>{el.textContent=H[Math.floor(Math.random()*3)].e},90)}
function stop(s){clearInterval(timers[s]);$("h"+s).classList.remove("spin")}
function showGo(label,fn){goAction=fn;$("go").textContent=label;$("go").hidden=false}
function hideGo(){$("go").hidden=true}
function status(t,sub){$("st").innerHTML=t+(sub?"<small>"+sub+"</small>":"")}

function pick(side,v){
  if(side==="a"&&phase==="pickA"){ca=v;spin("a");phase="pickB";setPickers();status("ตาของ "+nameB+" แล้ว","เลือกเลย หรือกด 🎲 สุ่ม")}
  else if(side==="b"&&phase==="pickB"){cb=v;spin("b");phase="ready";setPickers();status("เลือกครบแล้ว","กดปุ่มเพื่อเปิดผลพร้อมกัน");showGo("เป่า ยิ้ง ฉุบ!!",countdown)}
}
async function countdown(){
  phase="busy";hideGo();
  openOv();for(const [i,w] of ["เป่า","ยิ้ง","ฉุบ!!"].entries()){status(w);setWord(w,i===2);await wait(650)}
  reveal();
}
function reveal(){
  stop("a");stop("b");
  $("ha").textContent=H[ca].e;$("hb").textContent=H[cb].e;
  $("la").textContent=H[ca].n;$("lb").textContent=H[cb].n;
  if(ca===cb){status("เสมอ!","ไม่มีใครชนะ");showGo("เป่าอีกครั้ง",rematch)}
  else if(beats(ca,cb)){$("pa").classList.add("won");$("pb").classList.add("lost");status(nameA+" เป็นผู้ชนะ",H[ca].n+" ชนะ "+H[cb].n);showGo("เริ่มเกมใหม่",newGame)}
  else{$("pb").classList.add("won");$("pa").classList.add("lost");status(nameB+" เป็นผู้ชนะ",H[cb].n+" ชนะ "+H[ca].n);showGo("เริ่มเกมใหม่",newGame)}
  phase="done";setPickers();showResult();
}
async function rematch(){ // เป่าซ้ำ: สุ่มทั้งสองฝั่ง หมุนแล้วโชว์ผลเลย
  phase="busy";hideGo();clearMarks();
  ca=rnd();cb=rnd();$("la").innerHTML=$("lb").innerHTML="&nbsp;";
  spin("a");spin("b");status("กำลังสุ่ม…");
  openOv();const tm=setInterval(()=>setWord(H[Math.floor(Math.random()*3)].e,false,true),110);await wait(1500);clearInterval(tm);reveal();
}
function clearMarks(){["pa","pb"].forEach(i=>$(i).classList.remove("won","lost"))}
function newGame(){
  stop("a");stop("b");clearMarks();ca=cb=null;phase="pickA";
  $("ha").textContent=$("hb").textContent="❔";$("la").innerHTML=$("lb").innerHTML="&nbsp;";
  hideGo();setPickers();status(nameA+" เลือกก่อน","เลือกเอง หรือกด 🎲 สุ่ม");
}
$("go").onclick=()=>goAction&&goAction();
$("rgo").onclick=()=>{closeOv();goAction&&goAction()};
$("rclose").onclick=closeOv;
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("card").hidden)closeOv()});
buildPick("a");buildPick("b");newGame();
</script>
</body>
</html>
